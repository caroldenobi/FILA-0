<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FilaZero - Gerenciar Cardápio</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header class="topo">

    <div class="logo">
        🍴 FilaZero
    </div>


    <div class="usuario">

        <strong>
            👩‍🍳 Cantina
        </strong>

        <a href="painel.html">
            Pedidos
        </a>

        <a href="/logout">
            Sair
        </a>

    </div>

</header>



<main class="pagina">


    <section class="boas-vindas">

        <h1>
            Gerenciar cardápio 🍔
        </h1>

        <p>
            Adicione, edite ou remova produtos da cantina.
        </p>

    </section>



    <div class="acoes-cardapio">

        <button
            onclick="abrirFormulario()"
        >

            + Adicionar produto

        </button>

    </div>



    <!-- ======================================
         FORMULÁRIO
    ======================================= -->

    <section
        id="formularioProduto"
        class="formulario-produto"
        style="display: none;"
    >

        <h2 id="tituloFormulario">
            Adicionar produto
        </h2>


        <form id="produtoForm">


            <input
                type="hidden"
                id="produtoId"
            >


            <label>
                Nome do produto
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Ex: X-Salada"
                required
            >


            <label>
                Descrição
            </label>

            <textarea
                id="descricao"
                placeholder="Descreva o produto"
            ></textarea>


            <label>
                Preço
            </label>

            <input
                type="number"
                id="preco"
                step="0.01"
                min="0"
                placeholder="0.00"
                required
            >


            <label>
                Categoria
            </label>

            <select
                id="categoria"
                required
            >

                <option value="">
                    Selecione uma categoria
                </option>

                <option value="Lanches">
                    Lanches
                </option>

                <option value="Bebidas">
                    Bebidas
                </option>

                <option value="Almoço">
                    Almoço
                </option>

                <option value="Doces">
                    Doces
                </option>

                <option value="Outros">
                    Outros
                </option>

            </select>


            <label>
                Nome da imagem
            </label>

            <input
                type="text"
                id="imagem"
                placeholder="Ex: xsalada.jpg"
            >


            <div class="formulario-botoes">

                <button
                    type="submit"
                >
                    Salvar produto
                </button>


                <button
                    type="button"
                    class="botao-cancelar"
                    onclick="fecharFormulario()"
                >
                    Cancelar
                </button>

            </div>


        </form>

    </section>



    <!-- ======================================
         LISTA DE PRODUTOS
    ======================================= -->

    <section>

        <h2 class="titulo-produtos">
            Produtos cadastrados
        </h2>


        <div
            id="listaProdutos"
            class="lista-produtos"
        >

            Carregando produtos...

        </div>

    </section>


</main>


<script src="js/produtos.js"></script>


</body>

</html>
