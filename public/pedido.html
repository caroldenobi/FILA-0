<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FilaZero - Meu pedido</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header class="topo">

    <div class="logo">
        🍴 FilaZero
    </div>


    <div class="usuario">

        <a href="cardapio.html">
            Cardápio
        </a>

        <a href="meus-pedidos.html">
            Meus pedidos
        </a>

        <a href="/logout">
            Sair
        </a>

    </div>

</header>



<main class="pagina pedido-pagina">


    <section class="boas-vindas">

        <h1>
            Seu pedido 🛒
        </h1>

        <p>
            Confira os produtos antes de confirmar.
        </p>

    </section>



    <section class="pedido-container">


        <div>

            <h2>
                Produtos
            </h2>


            <div id="listaPedido">

                Carregando...

            </div>

        </div>



        <div class="resumo-pedido">


            <h2>
                Resumo
            </h2>


            <div class="linha">

                <span>
                    Total
                </span>

                <strong id="total">
                    R$ 0,00
                </strong>

            </div>


            <label for="horario">

                Horário para retirada

            </label>


            <select id="horario">

                <option value="">
                    Selecione um horário
                </option>

                <option value="10:00">
                    10:00
                </option>

                <option value="10:30">
                    10:30
                </option>

                <option value="11:00">
                    11:00
                </option>

                <option value="11:30">
                    11:30
                </option>

                <option value="12:00">
                    12:00
                </option>

                <option value="12:30">
                    12:30
                </option>

                <option value="13:00">
                    13:00
                </option>

                <option value="13:30">
                    13:30
                </option>

            </select>


            <button
                id="confirmar"
                onclick="confirmarPedido()"
            >

                Confirmar pedido

            </button>


        </div>


    </section>


</main>


<script src="js/pedido.js"></script>


</body>

</html>
